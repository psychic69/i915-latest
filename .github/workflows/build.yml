name: Build i915 SR-IOV for Unraid

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel string from uname -r"
        required: true
        default: "6.18.58-Unraid"
      base_version:
        description: "Base kernel version from kernel.org"
        required: true
        default: "6.18.58"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          apt-get update && apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc git curl xz-utils kmod python3

      - name: Download Vanilla Kernel Source
        run: |
          curl -LO "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ github.event.inputs.base_version }}.tar.xz"
          tar -xf "linux-${{ github.event.inputs.base_version }}.tar.xz"
          mv "linux-${{ github.event.inputs.base_version }}" linux-src

      - name: Generate Kernel Build Headers
        run: |
          cd linux-src

          # 1. Match vermagic exactly
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -Unraid/' Makefile

          # 2. Base x86_64 configuration
          make x86_64_defconfig

          # 3. Enable module system & DRM/PCI prerequisites for i915
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODVERSIONS
          ./scripts/config --enable CONFIG_DRM
          ./scripts/config --enable CONFIG_DRM_I915
          ./scripts/config --enable CONFIG_PCI
          ./scripts/config --enable CONFIG_ACPI

          # 4. Resolve defaults and build module headers & scripts
          make olddefconfig
          make modules_prepare

      - name: Compile i915 SR-IOV Module
        run: |
          git clone https://github.com/strongtz/i915-sriov-dkms.git
          cd i915-sriov-dkms
          
          # Build against our prepared kernel tree
          make -C ../linux-src M=$(pwd) modules

      - name: Package Slackware .txz
        run: |
          KVER="${{ github.event.inputs.kernel_version }}"
          PKG_DIR="/tmp/pkg"
          TARGET_DIR="${PKG_DIR}/lib/modules/${KVER}/kernel/drivers/gpu/drm/i915"
          
          mkdir -p "${TARGET_DIR}"
          mkdir -p "${PKG_DIR}/install"

          # Compress module with xz
          xz -c i915-sriov-dkms/i915.ko > "${TARGET_DIR}/i915.ko.xz"

          # Install hook for depmod
          cat << 'EOF' > "${PKG_DIR}/install/doinst.sh"
          #!/bin/bash
          depmod -a
          EOF
          chmod +x "${PKG_DIR}/install/doinst.sh"

          # Build package and hash
          cd "${PKG_DIR}"
          tar -cJf "/tmp/i915-sriov-${KVER}.txz" *
          cd /tmp
          md5sum "i915-sriov-${KVER}.txz" > "i915-sriov-${KVER}.txz.md5"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i915-sriov-${{ github.event.inputs.kernel_version }}
          path: |
            /tmp/i915-sriov-*.txz
            /tmp/i915-sriov-*.txz.md5
